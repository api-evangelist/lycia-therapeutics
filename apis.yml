name: Lycia Therapeutics
description: 'Lycia Therapeutics is a South San Francisco, California biotechnology company developing
  a new class of targeted protein degradation medicines built on its proprietary lysosomal targeting
  chimera (LYTAC) platform, which originated in the Stanford University laboratory of Nobel laureate
  Carolyn Bertozzi, Ph.D. LYTAC molecules bind a disease-driving extracellular protein and shuttle it
  into the cell for destruction by the lysosome, allowing Lycia to pursue circulating and membrane-bound
  proteins that conventional small molecules and antibodies have been unable to drug. The company is led
  by President and Chief Executive Officer Aetna Wun Trombley, Ph.D., is backed by Versant Ventures,
  Redmile Group, Venrock, RTW and Blue Owl among others, and has partnered with Eli Lilly and Company to
  discover and develop LYTAC degraders. Lycia is a privately held, research-stage therapeutics company;
  it publishes no public developer program, API, or machine-readable API artifacts.'
